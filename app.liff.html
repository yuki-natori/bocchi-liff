<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>bocchi</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --green:#2f6d4f; --line:#06c755; --paper:#faf7f0; --ink:#2b2b28;
      --sub:#6b6b63; --accent:#e6a817; --err:#d6453d; --radius:14px;
    }
    body {
      font-family:-apple-system,"Hiragino Sans","Helvetica Neue",sans-serif;
      background:var(--paper); color:var(--ink); line-height:1.6;
      -webkit-font-smoothing:antialiased; padding:0 0 48px;
    }
    .wrap { max-width:480px; margin:0 auto; padding:24px 20px; }
    .hidden { display:none !important; }

    /* 共通 */
    .head { text-align:center; margin-bottom:20px; }
    .logo { font-size:26px; font-weight:800; color:var(--green); letter-spacing:1px; }
    .head p { font-size:13px; color:var(--sub); margin-top:4px; }
    .spinner {
      width:36px; height:36px; margin:0 auto 16px;
      border:3px solid #e5e2d8; border-top-color:var(--green);
      border-radius:50%; animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    #boot { text-align:center; padding:64px 20px; color:var(--sub); }
    .ng { color:var(--err); font-weight:700; }
    .ok { color:var(--green); font-weight:700; }
    .status { text-align:center; font-size:14px; margin-top:14px; min-height:20px; }
    .submit {
      width:100%; padding:16px; font-size:16px; font-weight:800;
      color:#fff; background:var(--line); border:none; border-radius:12px;
      cursor:pointer; margin-top:8px;
    }
    .submit:disabled { opacity:.5; }

    /* LINE名カード */
    .me { display:flex; align-items:center; gap:12px; background:#fff;
      border:1px solid #ece8dc; border-radius:var(--radius); padding:12px 14px; margin-bottom:22px; }
    .me img { width:44px; height:44px; border-radius:50%; background:#eee; object-fit:cover; }
    .me .name { font-weight:700; font-size:15px; }
    .me .label { font-size:11px; color:var(--sub); }

    /* フォーム */
    .field { margin-bottom:20px; }
    .field label { display:block; font-size:13px; font-weight:700; margin-bottom:7px; }
    .field .req { color:var(--err); font-size:11px; margin-left:4px; }
    .field input, .field select {
      width:100%; padding:13px 14px; font-size:16px; border:1px solid #d9d4c6;
      border-radius:12px; background:#fff; color:var(--ink); appearance:none; -webkit-appearance:none;
    }
    .field input:focus, .field select:focus { outline:none; border-color:var(--green); }
    .field .hint { font-size:11px; color:var(--sub); margin-top:5px; }
    .select-wrap { position:relative; }
    .select-wrap::after { content:"▾"; position:absolute; right:14px; top:50%;
      transform:translateY(-50%); color:var(--sub); pointer-events:none; }

    /* ホーム：プロフィール要約 */
    .profile-bar { display:flex; justify-content:space-between; align-items:center;
      background:#fff; border:1px solid #ece8dc; border-radius:var(--radius);
      padding:12px 14px; margin-bottom:20px; }
    .profile-bar .pname { font-weight:800; font-size:16px; }
    .profile-bar .pmeta { font-size:12px; color:var(--sub); }
    .link-btn { font-size:12px; color:var(--green); background:none; border:none;
      text-decoration:underline; cursor:pointer; }

    /* グループ発表カード */
    .group-box { background:linear-gradient(160deg,#2f6d4f,#3f8a64); color:#fff;
      border-radius:var(--radius); padding:20px 18px; margin-bottom:20px; text-align:center; }
    .group-box .lead { font-size:13px; opacity:.9; }
    .group-box .gname { font-size:30px; font-weight:800; margin:6px 0 2px; }
    .group-box .gsub { font-size:12px; opacity:.9; margin-bottom:14px; }
    .gspot { background:rgba(255,255,255,.18); border-radius:10px; padding:8px 12px;
      margin-bottom:12px; font-size:15px; font-weight:700; }
    .group-members { background:#fff; border-radius:12px; padding:10px; }
    .checkin-status { margin-top:14px; font-size:14px; font-weight:700; }
    .checkin-status .allset { font-size:16px; }
    .gmember { display:flex; justify-content:space-between; align-items:center;
      padding:9px 10px; border-bottom:1px solid #f0ece1; }
    .gmember:last-child { border-bottom:none; }
    .gmember .gm-name { font-weight:700; color:var(--ink); font-size:15px; }
    .gmember .gm-topic { font-size:11px; color:var(--sub); }
    .gmember.me { background:#f3faf5; border-radius:8px; }
    .gmember.me .gm-name::after { content:" (あなた)"; color:var(--green); font-size:11px; }

    /* 不成立カード */
    .unmatched-box { background:#fff6f5; border:1.5px solid #f0c9c5; border-radius:var(--radius);
      padding:16px; margin-bottom:20px; }
    .unmatched-box .um-title { font-weight:800; color:var(--err); font-size:15px; margin-bottom:6px; }
    .unmatched-box .um-text { font-size:13px; color:var(--sub); }

    /* クーポン */
    #couponBox { margin-top:8px; margin-bottom:20px; }
    .coupon { display:flex; align-items:center; gap:12px; background:#fffaf0;
      border:1.5px dashed var(--accent); border-radius:12px; padding:14px; margin-bottom:10px; }
    .coupon .amt { font-size:22px; font-weight:800; color:var(--accent); white-space:nowrap; }
    .coupon .cinfo { font-size:12px; color:var(--sub); }

    /* 予約済みカード */
    .reserved { background:#eaf6ef; border:1.5px solid var(--green); border-radius:var(--radius);
      padding:16px; margin-bottom:20px; }
    .reserved .tag { font-size:12px; font-weight:700; color:var(--green); }
    .reserved .slot { font-size:18px; font-weight:800; margin:4px 0 12px; }
    .btn-cancel { width:100%; padding:12px; font-size:14px; font-weight:700; color:var(--err);
      background:#fff; border:1.5px solid var(--err); border-radius:10px; cursor:pointer; }

    /* スロット */
    .section-title { font-size:14px; font-weight:700; margin-bottom:12px; }
    .slot-card { display:block; background:#fff; border:1.5px solid #e3ddcd; border-radius:var(--radius);
      padding:14px 16px; margin-bottom:12px; cursor:pointer; position:relative; transition:border-color .15s; }
    .slot-card.sel { border-color:var(--green); background:#f3faf5; }
    .slot-card.disabled { opacity:.5; cursor:not-allowed; }
    .slot-card input { position:absolute; opacity:0; pointer-events:none; }
    .slot-date { font-size:13px; color:var(--sub); }
    .slot-time { font-size:18px; font-weight:800; }
    .slot-meta { font-size:12px; margin-top:4px; }
    .slot-meta .ok-rem { color:var(--green); font-weight:700; }
    .slot-meta .full { color:var(--err); font-weight:700; }
    .empty { text-align:center; color:var(--sub); font-size:14px; padding:24px 0; }

    /* 完了 */
    #screen-done { text-align:center; padding:40px 12px; }
    #screen-done .mark { font-size:52px; }
    #screen-done h2 { font-size:20px; color:var(--green); margin:12px 0 6px; }
    #screen-done p { font-size:14px; color:var(--sub); }
    .back-btn { margin-top:20px; font-size:14px; color:var(--green); background:none;
      border:1px solid var(--green); border-radius:10px; padding:10px 20px; cursor:pointer; }
  </style>
</head>
<body>
  <!-- 起動中 -->
  <div id="boot"><div class="spinner"></div>読み込み中…</div>

  <!-- 登録 / 編集 -->
  <div class="wrap hidden" id="screen-register">
    <div class="head">
      <div class="logo">bocchi</div>
      <p id="regSub">当日のグループ分けに使うプロフィールを登録してね</p>
    </div>
    <div class="me">
      <img id="meIcon" src="" alt="" />
      <div>
        <div class="name" id="meName">—</div>
        <div class="label">LINEアカウント連携済み ✓</div>
      </div>
    </div>
    <form id="regForm">
      <div class="field">
        <label>ニックネーム<span class="req">必須</span></label>
        <input type="text" id="nickname" maxlength="20" placeholder="当日呼ばれたい名前" autocomplete="off" />
        <div class="hint">ひらがな・カタカナ・英字どれでもOK（20文字まで）</div>
      </div>
      <div class="field">
        <label>性別</label>
        <div class="select-wrap">
          <select id="gender">
            <option value="">選択しない</option>
            <option value="男性">男性</option>
            <option value="女性">女性</option>
            <option value="その他">その他</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>話したい話題</label>
        <div class="select-wrap">
          <select id="topic">
            <option value="">選択しない</option>
            <option value="副業・IT">副業・IT</option>
            <option value="投資・お金">投資・お金</option>
            <option value="趣味・遊び">趣味・遊び</option>
            <option value="仕事・キャリア">仕事・キャリア</option>
            <option value="音楽・フェス">音楽・フェス</option>
            <option value="なんでも">なんでも</option>
          </select>
        </div>
        <div class="hint">同じ話題の人と組みやすくなるよ</div>
      </div>
      <button type="submit" class="submit" id="regBtn">この内容で登録する</button>
      <button type="button" class="back-btn hidden" id="regBackBtn" style="width:100%;margin-top:10px">戻る</button>
      <div class="status" id="regStatus"></div>
    </form>
  </div>

  <!-- ホーム（予約）-->
  <div class="wrap hidden" id="screen-home">
    <div class="head">
      <div class="logo">bocchi</div>
      <p>参加したい日時を選んで予約してね</p>
    </div>
    <div class="profile-bar">
      <div>
        <div class="pname" id="homeName">—</div>
        <div class="pmeta" id="homeMeta"></div>
      </div>
      <button class="link-btn" id="editBtn">プロフィール編集</button>
    </div>

    <!-- マッチング後：グループ発表 -->
    <div class="group-box hidden" id="groupBox">
      <div class="lead">🎉 あなたのグループが決まりました</div>
      <div class="gname" id="groupName">—</div>
      <div class="gsub" id="groupSlot"></div>
      <div class="gspot hidden" id="groupSpot"></div>
      <div class="group-members" id="groupMembers"></div>
      <div class="checkin-status" id="checkinStatus"></div>
    </div>

    <!-- マッチング不成立の案内 -->
    <div class="unmatched-box hidden" id="unmatchedBox">
      <div class="um-title">😢 今回はグループが成立しませんでした</div>
      <div class="um-text">人数が集まらず、グループを作れませんでした。<br>おわびにクーポンをお送りしました。次回ぜひご参加ください。</div>
    </div>

    <div class="reserved hidden" id="reservedBox">
      <div class="tag">✓ 予約済み</div>
      <div class="slot" id="reservedSlot">—</div>
      <button class="btn-cancel" id="cancelBtn">予約をキャンセルする</button>
    </div>

    <div id="chooseBox">
      <div class="section-title">参加できる日時</div>
      <div id="slotList"></div>
      <button class="submit" id="reserveBtn" disabled>この日時で予約する</button>
    </div>

    <!-- 所持クーポン -->
    <div class="hidden" id="couponBox">
      <div class="section-title">🎟 お持ちのクーポン</div>
      <div id="couponList"></div>
    </div>

    <div class="status" id="homeStatus"></div>
  </div>

  <!-- 完了 -->
  <div class="wrap hidden" id="screen-done">
    <div class="mark">🎉</div>
    <h2 id="doneTitle">完了しました</h2>
    <p id="doneMsg"></p>
    <button class="back-btn" id="doneBackBtn">トップに戻る</button>
  </div>

  <script>
    const LIFF_ID = "2010205663-iIzLQGpb";
    const BASE = "https://us-central1-bocchi-liff-test.cloudfunctions.net";

    let profile = null;       // LINEプロフィール
    let currentUser = null;   // Firestoreのユーザー情報（未登録ならnull）
    let selectedSlotId = null;
    let checkinJustDone = null; // チェックインリンクで開いた直後の結果
    let checkinError = null;

    const $ = (id) => document.getElementById(id);
    const api = async (path, params) => {
      const qs = params ? "?" + new URLSearchParams(params).toString() : "";
      const res = await fetch(BASE + "/" + path + qs);
      return res.json();
    };
    function showScreen(name) {
      ["boot","screen-register","screen-home","screen-done"].forEach(id => {
        $(id).classList.toggle("hidden", id !== name);
      });
    }
    function setStatus(id, m, c) { const e=$(id); e.textContent=m; e.className="status "+(c||""); }

    function formatSlot(date, time) {
      const d = new Date(date + "T00:00:00+09:00");
      const w = ["日","月","火","水","木","金","土"][d.getDay()];
      return (d.getMonth()+1) + "/" + d.getDate() + "(" + w + ") " + time;
    }

    // ===== 起動 =====
    async function main() {
      try { await liff.init({ liffId: LIFF_ID }); }
      catch (e) { return bootError("LIFF初期化に失敗: " + e.message); }
      if (!liff.isLoggedIn()) { liff.login(); return; }
      try { profile = await liff.getProfile(); }
      catch (e) { return bootError("プロフィール取得に失敗: " + e.message); }

      $("meName").textContent = profile.displayName || "—";
      if (profile.pictureUrl) $("meIcon").src = profile.pictureUrl;

      const r = await api("getUser", { lineUserId: profile.userId });
      currentUser = r.user;

      // チェックインリンク（?mode=checkin）で開かれたら、先にチェックインを実行
      const mode = new URLSearchParams(window.location.search).get("mode");
      if (currentUser && mode === "checkin") {
        const c = await api("checkIn", { lineUserId: profile.userId });
        checkinJustDone = c.ok ? c : null;
        if (!c.ok) checkinError = c.error || "チェックインに失敗しました";
      }

      if (!currentUser) {
        openRegister(false); // 新規登録
      } else {
        await openHome();
      }
    }
    function bootError(m) {
      $("boot").innerHTML = '<p class="ng">エラー</p><p style="font-size:13px;color:#6b6b63;margin-top:8px">'+m+'</p>';
    }

    // ===== 登録 / 編集画面 =====
    function openRegister(isEdit) {
      $("regSub").textContent = isEdit ? "プロフィールを編集できます" : "当日のグループ分けに使うプロフィールを登録してね";
      $("regBtn").textContent = isEdit ? "この内容で更新する" : "この内容で登録する";
      $("regBackBtn").classList.toggle("hidden", !isEdit);
      // 既存値で埋める（編集時）／LINE名で埋める（新規時）
      $("nickname").value = currentUser ? (currentUser.nickname || "") : (profile.displayName || "");
      $("gender").value   = currentUser ? (currentUser.gender || "") : "";
      $("topic").value    = currentUser ? (currentUser.topic || "") : "";
      setStatus("regStatus", "", "");
      $("regBtn").disabled = false;
      showScreen("screen-register");
    }

    $("regForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const nickname = $("nickname").value.trim();
      if (!nickname) { setStatus("regStatus", "ニックネームを入力してください", "ng"); return; }
      $("regBtn").disabled = true;
      setStatus("regStatus", "送信中…", "");
      const r = await api("registerUser", {
        lineUserId: profile.userId,
        displayName: profile.displayName || "",
        nickname: nickname,
        gender: $("gender").value,
        topic: $("topic").value
      });
      if (r.ok) {
        // 最新のユーザー情報を取り直してホームへ
        const u = await api("getUser", { lineUserId: profile.userId });
        currentUser = u.user;
        $("doneTitle").textContent = r.isNew ? "登録が完了しました" : "プロフィールを更新しました";
        $("doneMsg").textContent = r.isNew ? "続いて参加日時を予約しましょう。" : "";
        showScreen("screen-done");
      } else {
        setStatus("regStatus", "エラー：" + (r.error || ""), "ng");
        $("regBtn").disabled = false;
      }
    });
    $("regBackBtn").addEventListener("click", openHome);

    // ===== ホーム（予約）=====
    async function openHome() {
      setStatus("homeStatus", "", ""); // 前画面のステータス文言をクリア
      // プロフィール要約
      $("homeName").textContent = (currentUser.nickname || "") + " さん";
      const meta = [currentUser.gender, currentUser.topic].filter(Boolean).join("・");
      $("homeMeta").textContent = meta;
      await renderReservation();
      if (checkinError) { setStatus("homeStatus", "⚠️ " + checkinError, "ng"); checkinError = null; }
      showScreen("screen-home");
    }

    async function renderReservation() {
      const [mine, slotsRes, myGroup, myCoupons] = await Promise.all([
        api("getMyReservation", { lineUserId: profile.userId }),
        api("getSlots"),
        api("getMyGroup", { lineUserId: profile.userId }),
        api("getMyCoupons", { lineUserId: profile.userId })
      ]);

      // 所持クーポンは常に表示
      renderCoupons(myCoupons.coupons || []);

      if (!mine.reservation) {
        // 未予約 → スロット選択
        $("groupBox").classList.add("hidden");
        $("unmatchedBox").classList.add("hidden");
        $("reservedBox").classList.add("hidden");
        $("chooseBox").classList.remove("hidden");
        renderSlots(slotsRes.slots || []);
        return;
      }

      // 予約あり
      const r = mine.reservation;
      $("reservedSlot").textContent = formatSlot(r.date, r.time);
      $("chooseBox").classList.add("hidden");

      if (myGroup.group) {
        // マッチング済み → グループ発表を表示。予約カードは出すがキャンセルは隠す
        renderGroup(myGroup.group);
        $("groupBox").classList.remove("hidden");
        $("unmatchedBox").classList.add("hidden");
        $("reservedBox").classList.remove("hidden");
        $("cancelBtn").classList.add("hidden");
      } else if (myGroup.unmatched) {
        // 不成立 → おわび案内（予約カード・キャンセルは隠す）
        $("groupBox").classList.add("hidden");
        $("unmatchedBox").classList.remove("hidden");
        $("reservedBox").classList.add("hidden");
      } else {
        // 予約済み・未マッチ → 予約カード＋キャンセル
        $("groupBox").classList.add("hidden");
        $("unmatchedBox").classList.add("hidden");
        $("reservedBox").classList.remove("hidden");
        $("cancelBtn").classList.remove("hidden");
      }
    }

    function renderCoupons(coupons) {
      const box = $("couponBox");
      const list = $("couponList");
      if (!coupons.length) { box.classList.add("hidden"); return; }
      list.innerHTML = "";
      coupons.forEach((c) => {
        const row = document.createElement("div");
        row.className = "coupon";
        row.innerHTML =
          '<span class="amt">¥' + Number(c.amount).toLocaleString() + '</span>' +
          '<span class="cinfo">割引クーポン<br>' + (c.reason || "") + '</span>';
        list.appendChild(row);
      });
      box.classList.remove("hidden");
    }

    function renderGroup(g) {
      $("groupName").textContent = g.name + " グループ";
      $("groupSlot").textContent = formatSlot(g.date, g.time);
      // 集合場所
      const spotEl = $("groupSpot");
      if (g.spotLabel) {
        spotEl.textContent = "📍 集合場所：" + g.spotLabel;
        spotEl.classList.remove("hidden");
      } else {
        spotEl.classList.add("hidden");
      }
      const box = $("groupMembers");
      box.innerHTML = "";
      (g.members || []).forEach((m) => {
        const isMe = (m.nickname === (currentUser.nickname || ""));
        const row = document.createElement("div");
        row.className = "gmember" + (isMe ? " me" : "");
        row.innerHTML =
          '<span class="gm-name">' + (m.nickname || "") + '</span>' +
          '<span class="gm-topic">' + (m.topic || "") + '</span>';
        box.appendChild(row);
      });

      // 到着状況
      const cs = $("checkinStatus");
      const total = g.total || (g.members || []).length;
      const arrived = g.arrived || 0;
      if (arrived >= total && total > 0) {
        cs.innerHTML = '<span class="allset">🙌 全員集合しました！</span>';
      } else if (g.checkedIn) {
        cs.innerHTML = '✅ チェックイン済み（到着 ' + arrived + '/' + total + '人）';
      } else {
        cs.innerHTML = '到着 ' + arrived + '/' + total + '人<br>'
          + '<span style="font-weight:400;font-size:12px;opacity:.9">会場でLINEのチェックインリンクをタップしてね</span>';
      }
    }

    function renderSlots(slots) {
      const list = $("slotList");
      list.innerHTML = "";
      selectedSlotId = null;
      $("reserveBtn").disabled = true;
      if (slots.length === 0) {
        list.innerHTML = '<div class="empty">現在予約できる日時がありません</div>';
        return;
      }
      slots.forEach((s) => {
        const disabled = s.isFull || s.closed;
        const label = document.createElement("label");
        label.className = "slot-card" + (disabled ? " disabled" : "");
        let meta;
        if (s.closed)      meta = '<span class="full">締切</span>';
        else if (s.isFull) meta = '<span class="full">満席</span>';
        else               meta = '<span class="ok-rem">残り' + s.remaining + '席</span>';
        label.innerHTML =
          '<input type="radio" name="slot" value="' + s.slotId + '"' + (disabled?' disabled':'') + '>' +
          '<div class="slot-date">' + formatSlot(s.date, "").trim() + '</div>' +
          '<div class="slot-time">' + s.time + '</div>' +
          '<div class="slot-meta">' + meta + '</div>';
        if (!disabled) {
          label.addEventListener("click", () => {
            document.querySelectorAll(".slot-card").forEach(c => c.classList.remove("sel"));
            label.classList.add("sel");
            label.querySelector("input").checked = true;
            selectedSlotId = s.slotId;
            $("reserveBtn").disabled = false;
          });
        }
        list.appendChild(label);
      });
    }

    $("reserveBtn").addEventListener("click", async () => {
      if (!selectedSlotId) return;
      $("reserveBtn").disabled = true;
      setStatus("homeStatus", "予約中…", "");
      const r = await api("reserveSlot", { lineUserId: profile.userId, slotId: selectedSlotId });
      if (r.ok) {
        $("doneTitle").textContent = "予約が完了しました";
        $("doneMsg").textContent = formatSlot(r.date, r.time) + "\n当日のグループ分けをお楽しみに！";
        showScreen("screen-done");
      } else {
        setStatus("homeStatus", "予約できませんでした：" + (r.error || ""), "ng");
        await renderReservation();
      }
    });

    $("cancelBtn").addEventListener("click", async () => {
      if (!confirm("予約をキャンセルしますか？")) return;
      $("cancelBtn").disabled = true;
      setStatus("homeStatus", "キャンセル中…", "");
      const r = await api("cancelReservation", { lineUserId: profile.userId });
      $("cancelBtn").disabled = false;
      if (r.ok) { setStatus("homeStatus", "", ""); await renderReservation(); }
      else { setStatus("homeStatus", "キャンセルに失敗：" + (r.error || ""), "ng"); }
    });

    $("editBtn").addEventListener("click", () => openRegister(true));
    $("doneBackBtn").addEventListener("click", openHome);

    main();
  </script>
</body>
</html>
